
<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Sign Up - Crazy Crave</title>


    <style>

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: Arial, sans-serif;
        }

        body {
            min-height: 100vh;
            background: linear-gradient(
                135deg,
                #fff3e0,
                #ffe4ec
            );

            display: flex;
            flex-direction: column;
        }


        /* ================= NAVBAR ================= */

        .navbar {

            background: white;

            padding: 18px 7%;

            display: flex;

            justify-content: space-between;

            align-items: center;

            box-shadow: 0 3px 15px rgba(0,0,0,0.08);

        }


        .logo {

            font-size: 27px;

            font-weight: bold;

            background: linear-gradient(
                135deg,
                #ff6b35,
                #ff4081
            );

            -webkit-background-clip: text;

            -webkit-text-fill-color: transparent;

        }


        .home-link {

            text-decoration: none;

            color: #333;

            font-weight: bold;

            padding: 10px 18px;

            border-radius: 25px;

            transition: 0.3s;

        }


        .home-link:hover {

            background: #fff3e0;

            color: #ff4081;

        }


        /* ================= MAIN ================= */

        .main-container {

            flex: 1;

            display: flex;

            justify-content: center;

            align-items: center;

            padding: 45px 20px;

        }


        /* ================= SIGNUP CARD ================= */

        .signup-card {

            width: 100%;

            max-width: 500px;

            background: white;

            padding: 35px;

            border-radius: 25px;

            box-shadow:
                0 12px 35px rgba(0,0,0,0.12);

        }


        .signup-icon {

            width: 75px;

            height: 75px;

            margin: 0 auto 15px;

            border-radius: 50%;

            background: #fff3e0;

            display: flex;

            align-items: center;

            justify-content: center;

            font-size: 38px;

        }


        .signup-card h1 {

            text-align: center;

            color: #ff4081;

            font-size: 32px;

            margin-bottom: 8px;

        }


        .subtitle {

            text-align: center;

            color: #777;

            margin-bottom: 25px;

            font-size: 14px;

        }


        /* ================= ERROR ================= */

        .error-message {

            background: #ffebee;

            color: #c62828;

            border: 1px solid #ffcdd2;

            padding: 13px 15px;

            border-radius: 12px;

            margin-bottom: 20px;

            text-align: center;

            font-weight: bold;

            font-size: 14px;

        }


        /* ================= SUCCESS ================= */

        .success-message {

            background: #e8f5e9;

            color: #2e7d32;

            border: 1px solid #c8e6c9;

            padding: 13px 15px;

            border-radius: 12px;

            margin-bottom: 20px;

            text-align: center;

            font-weight: bold;

            font-size: 14px;

        }


        /* ================= FORM ================= */

        .form-group {

            margin-bottom: 18px;

        }


        .form-group label {

            display: block;

            margin-bottom: 7px;

            color: #444;

            font-weight: bold;

            font-size: 14px;

        }


        .form-group input,

        .form-group textarea {

            width: 100%;

            padding: 13px 15px;

            border: 2px solid #eeeeee;

            border-radius: 12px;

            outline: none;

            font-size: 15px;

            transition: 0.3s;

        }


        .form-group textarea {

            min-height: 80px;

            resize: vertical;

        }


        .form-group input:focus,

        .form-group textarea:focus {

            border-color: #ff4081;

            box-shadow:
                0 0 8px rgba(255,64,129,0.15);

        }


        /* ================= BUTTON ================= */

        .signup-btn {

            width: 100%;

            border: none;

            padding: 15px;

            border-radius: 30px;

            background: linear-gradient(
                135deg,
                #ff6b35,
                #ff4081
            );

            color: white;

            font-size: 17px;

            font-weight: bold;

            cursor: pointer;

            transition: 0.3s;

            margin-top: 5px;

        }


        .signup-btn:hover {

            transform: translateY(-3px);

            box-shadow:
                0 8px 20px rgba(255,64,129,0.3);

        }


        /* ================= SIGN IN ================= */

        .signin-text {

            text-align: center;

            margin-top: 22px;

            color: #666;

            font-size: 14px;

        }


        .signin-text a {

            color: #ff4081;

            font-weight: bold;

            text-decoration: none;

        }


        .signin-text a:hover {

            text-decoration: underline;

        }


        /* ================= FOOTER ================= */

        footer {

            background: #222;

            color: white;

            text-align: center;

            padding: 20px;

            font-size: 14px;

        }


        footer span {

            color: #ff6b35;

        }


        /* ================= MOBILE ================= */

        @media (max-width: 600px) {

            .navbar {

                padding: 15px 5%;

            }


            .logo {

                font-size: 23px;

            }


            .signup-card {

                padding: 25px 20px;

            }


            .signup-card h1 {

                font-size: 28px;

            }

        }

    </style>

</head>


<body>


<!-- ================= NAVBAR ================= -->

<nav class="navbar">

    <div class="logo">

        🍔 Crazy Crave

    </div>


    <a
        href="{% url 'index' %}"
        class="home-link"
    >

        🏠 Home

    </a>

</nav>


<!-- ================= MAIN ================= -->

<main class="main-container">


    <div class="signup-card">


        <!-- Icon -->

        <div class="signup-icon">

            📝

        </div>


        <h1>

            Create Account

        </h1>


        <p class="subtitle">

            Join Crazy Crave and satisfy your cravings! 🍕🍔

        </p>


        <!-- ================= ERROR ================= -->

        {% if error %}

            <div class="error-message">

                ⚠️ {{ error }}

            </div>

        {% endif %}


        <!-- ================= SUCCESS ================= -->

        {% if success %}

            <div class="success-message">

                ✅ {{ success }}

            </div>

        {% endif %}


        <!-- ================= FORM ================= -->

        <form
            method="POST"
            action="{% url 'signup' %}"
        >

            {% csrf_token %}


            <!-- Username -->

            <div class="form-group">

                <label for="username">

                    👤 Username

                </label>

                <input
                    type="text"
                    id="username"
                    name="username"
                    placeholder="Enter username"
                    value="{{ request.POST.username }}"
                    required
                >

            </div>


            <!-- Email -->

            <div class="form-group">

                <label for="email">

                    📧 Email

                </label>

                <input
                    type="email"
                    id="email"
                    name="email"
                    placeholder="Enter your email"
                    value="{{ request.POST.email }}"
                    required
                >

            </div>


            <!-- Mobile -->

            <div class="form-group">

                <label for="mobile">

                    📱 Mobile Number

                </label>

                <input
                    type="tel"
                    id="mobile"
                    name="mobile"
                    placeholder="Enter mobile number"
                    value="{{ request.POST.mobile }}"
                    required
                >

            </div>


            <!-- Address -->

            <div class="form-group">

                <label for="address">

                    📍 Address

                </label>

                <textarea
                    id="address"
                    name="address"
                    placeholder="Enter your address"
                    required
                >{{ request.POST.address }}</textarea>

            </div>


            <!-- Password -->

            <div class="form-group">

                <label for="password">

                    🔒 Password

                </label>

                <input
                    type="password"
                    id="password"
                    name="password"
                    placeholder="Create password"
                    required
                >

            </div>


            <!-- Confirm Password -->

            <div class="form-group">

                <label for="confirm_password">

                    🔐 Confirm Password

                </label>

                <input
                    type="password"
                    id="confirm_password"
                    name="confirm_password"
                    placeholder="Confirm password"
                    required
                >

            </div>


            <!-- Submit -->

            <button
                type="submit"
                class="signup-btn"
            >

                🚀 Create Account

            </button>


        </form>


        <!-- Sign In -->

        <p class="signin-text">

            Already have an account?

            <a href="{% url 'open_signin' %}">

                Sign In

            </a>

        </p>


    </div>


</main>


<!-- ================= FOOTER ================= -->

<footer>

    <p>

        © 2026
        <span>Crazy Crave</span>
        |
        Made with ❤️ for food lovers

    </p>

</footer>


</body>

</html>
